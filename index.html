<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Web Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%230B3C5D%27/%3E%3Crect x=%2722%27 y=%2740%27 width=%2756%27 height=%2730%27 rx=%276%27 fill=%27%23F26B4E%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#0B3C5D; --blue:#1F6FB2; --coral:#F26B4E; --coral-soft:#FDEDE8;
    --bg:#FFFFFF; --soft:#F4F7FA; --line:#E3E8EE; --ink:#1B2430; --muted:#5B6773;
    --radius:16px; --shadow:0 8px 28px rgba(11,60,93,.10); --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none !important}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  /* ───── 잠금 ───── */
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0B3C5D 0%,#1F6FB2 70%,#F26B4E 140%)}
  .lock-box{background:#fff;border-radius:20px;padding:36px 28px;width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;animation:rise .5s var(--ease) both}
  .lock-box h1{margin:8px 0 4px;font-size:22px;color:var(--navy)}
  .lock-box p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .lock-box input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:20px;text-align:center;letter-spacing:.3em}
  .lock-box input:focus{outline:none;border-color:var(--blue)}
  .lock-box label{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:12px 0;white-space:nowrap}
  .lock-msg{min-height:20px;font-size:13px;color:var(--coral);margin-top:8px}
  .name-box input{letter-spacing:0;font-size:17px}
  .name-box .hi{font-size:40px;display:inline-block;transform-origin:70% 70%;animation:hi 1.6s ease-in-out infinite}
  @keyframes hi{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(18deg)}20%,40%{transform:rotate(-8deg)}}
  .linkish{border:none;background:none;color:var(--muted);font-size:13px;margin-top:12px;text-decoration:underline;cursor:pointer}
  .greet{font-size:13.5px;font-weight:700;color:var(--coral);margin-bottom:2px}
  .greet:empty{display:none}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  /* ───── 메뉴 ───── */
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;gap:8px;height:56px}
  .brand{font-weight:800;color:var(--navy);margin-right:auto;white-space:nowrap}
  .menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu a{padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted);white-space:nowrap}
  .menu a:hover{background:var(--soft);color:var(--navy)}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--navy);white-space:nowrap}
  .pill:hover{border-color:var(--blue)}

  /* ───── 명함(뒤집기) ───── */
  #card{position:relative;padding:28px 0 6px;perspective:1600px}
  /* ───── 캐릭터 고개 내밀기 + 손인사 (명함 위 가장자리에서 살짝) ───── */
  .flip{position:relative;aspect-ratio:9/5;cursor:pointer;transform-style:preserve-3d;transition:transform .8s var(--ease)}
  .flip.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;background:#fff}
  .face.back{transform:rotateY(180deg)}
  .face::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(var(--navy),var(--coral));z-index:2}
  /* 물결: 명함 안에서만 */
  .waves{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .waves i{position:absolute;left:-20%;width:140%;height:60%;bottom:-30%;border-radius:45%;opacity:.35;animation:wave 14s linear infinite}
  .waves i:nth-child(1){background:#CFE3F5;animation-duration:16s}
  .waves i:nth-child(2){background:#9CC5E8;bottom:-36%;animation-duration:22s;animation-direction:reverse;opacity:.25}
  .waves i:nth-child(3){background:#F7C8BC;bottom:-42%;animation-duration:28s;opacity:.18}
  @keyframes wave{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .front{display:grid;grid-template-columns:2fr 3fr}
  .front .l{position:relative;display:flex;align-items:center;justify-content:center;padding:70px 24px 24px;background:var(--soft)}
  .avatar{position:relative;z-index:1;width:min(100%,220px);aspect-ratio:1;animation:float 6s ease-in-out infinite}
  .avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer;transition:filter .6s}
  .avatar.popping img{filter:brightness(.78) saturate(.6)}
  /* 동그라미 가운데 선 위로만 보이게 잘라, 엠버 상체가 원 안에서 올라오는 것처럼 */

  .avatar.popping .sprite{animation:popRise .6s var(--ease) forwards}
  .avatar.sinking .sprite{animation:popSink .55s var(--ease) forwards}
  @keyframes popRise{to{transform:translateY(0)}}
  @keyframes popSink{from{transform:translateY(0)}to{transform:translateY(103%)}}
  @keyframes float{50%{transform:translateY(-6px)}}
  .front .r{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
  .name-ko{font-size:34px;font-weight:800;color:var(--navy);line-height:1.15;margin:0}
  .name-en{font-size:15px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .aff{font-size:14px;color:var(--ink);margin-top:4px}
  .hint{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .hint svg{width:14px;height:14px;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .back{padding:28px 28px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .back-name{font-size:13px;color:var(--muted);letter-spacing:.04em}
  .tagline{font-size:20px;font-weight:700;color:var(--coral);line-height:1.4}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--navy)}
  .back-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;border:1px solid var(--navy);color:var(--navy);background:#fff;transition:transform .15s}
  .btn.primary{background:var(--navy);color:#fff}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
  .btn svg{width:16px;height:16px}
  .qr{width:84px;height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;flex:none}
  .img-why{font-size:12.5px;color:var(--muted);margin:0}

  /* ───── 누구신가요 ───── */
  #who{padding:22px 0 6px}
  .who-title{font-size:15px;color:var(--ink);margin:0 0 10px;font-weight:600}
  .faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .face-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:600;color:var(--navy);font-size:15px;transition:transform .15s,border-color .2s,background .2s}
  .face-btn:hover{transform:translateY(-2px);border-color:var(--blue)}
  .face-btn.on{border-color:var(--coral);background:var(--coral-soft)}
  .empty{margin:18px 0 60px;padding:28px;border:1.5px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted);font-size:14px}
  .hl{margin:14px 0 0;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:13.5px;color:var(--ink);animation:rise .5s var(--ease) both}
  .hl b{color:var(--navy)}
  .hl ol{margin:6px 0 0;padding-left:20px}

  /* ───── 섹션 ───── */
  section.block{padding:34px 0 6px;scroll-margin-top:64px;animation:rise .6s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .h h2{margin:0;font-size:22px;color:var(--navy)}
  .h span{font-size:13px;color:var(--muted)}
  .rank{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#fff;background:var(--coral);border-radius:999px;padding:2px 9px;margin-left:auto;align-self:center}
  .loading{color:var(--muted);font-size:14px;padding:10px 0}
  .in{opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .in.show{opacity:1;transform:none}

  .stories{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .story{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:#fff;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
  .story:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .story .k{font-size:12px;font-weight:700;color:var(--coral);letter-spacing:.04em}
  .story h3{margin:0;font-size:17px;color:var(--navy);line-height:1.35}
  .story dl{margin:0;font-size:13.5px}
  /* 이야기 카드: 닫혀 있을 때는 제목 문장만, 누르면 열림 */
  .story.sealed{cursor:pointer;min-height:150px;justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#fff,var(--soft))}
  .story.sealed .k{font-size:16px;color:var(--navy);letter-spacing:0}
  .story.sealed .seal{width:44px;height:44px;border-radius:50%;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:nudge 2.6s ease-in-out infinite}
  .story.sealed .seal svg{width:22px;height:22px;color:var(--coral)}
  @keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-4px)}}
  .story.sealed .open-hint{font-size:12px;color:var(--muted)}
  .story.sealed .body{display:none}
  .story.opened{cursor:pointer}
  .story.opened .seal,.story.opened .open-hint{display:none}
  .story.opened .body{animation:rise .5s var(--ease) both}
  .story .close{align-self:flex-end;border:none;background:none;color:var(--muted);font-size:12px;padding:4px 0 0}
  .story dt{color:var(--muted);font-size:12px;margin-top:8px}
  .story dd{margin:0}

  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .num{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
  .num .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .num .w{font-size:13.5px;color:var(--ink);margin-top:6px;font-weight:600}
  .num .b{font-size:12px;color:var(--muted);margin-top:4px}

  .tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:8px}
  .tl li{position:relative;padding:0 0 16px 22px}
  .tl li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--blue);transition:transform .4s}
  .tl li.show::before{transform:scale(1.15)}
  .tl li.cert::before{border-color:var(--coral)}
  .tl li.live::after{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;border:3px solid var(--blue);animation:pulse 2s ease-out infinite}
  @keyframes pulse{to{transform:scale(2.4);opacity:0}}
  .tl .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tl .n{font-weight:700;color:var(--ink)}
  .tl .r{font-size:13.5px;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--navy);border:1px solid var(--line);margin-left:6px;vertical-align:middle}
  .more{margin-top:4px}

  .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .sk{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .sk h4{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
  .sk .row{display:grid;grid-template-columns:1fr 90px 28px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
  .bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--navy));border-radius:999px;transition:width 1.1s var(--ease)}
  .lv{font-size:12px;color:var(--muted);text-align:right}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .goal{border-left:4px solid var(--coral);background:var(--soft);border-radius:0 12px 12px 0;padding:12px 14px}
  .goal b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}

  .ask-box,.contact-box{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:#fff}
  .faq{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .faq button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--navy)}
  .faq button:hover{border-color:var(--blue)}
  .inline{display:flex;gap:8px}
  .inline input,.contact-box input,.contact-box textarea{flex:1;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
  .inline input:focus,.contact-box input:focus,.contact-box textarea:focus{outline:none;border-color:var(--blue)}
  .answer{margin-top:12px;padding:14px;border-radius:12px;background:var(--soft);font-size:15px;min-height:52px;white-space:pre-wrap}
  .answer.err{color:var(--coral)}
  .dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .contact-box .stack{display:flex;flex-direction:column;gap:8px}
  .mailrow{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:10px}
  .mailrow svg{width:20px;height:20px;color:var(--navy)}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px}
  footer{padding:40px 0 60px;color:var(--muted);font-size:12.5px;text-align:center}

  @media (max-width:760px){
    .flip{aspect-ratio:5/7}
    .front{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .front .l{padding:126px 16px 8px;background:#fff}

<body>

<div id="lock">

    <input id="visitorName" type="text" maxlength="30" data-i18n-ph="name_input_ph" placeholder="예: 홍길동 · ○○기업 인사팀">
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:12px" data-i18n="name_enter">입장</button>

</div>

<div id="app" hidden>
  <nav><div class="wrap">

  <main class="wrap">
    <section id="card">

        <div class="face front">

              <button class="btn primary" id="vcardBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg><span data-i18n="save_contact">연락처 저장</span></button>

            </div>

    <section id="who">
      <p class="who-title" data-i18n="who_title">누구신가요? 보는 분에 맞춰 순서와 강조가 바뀝니다.</p>

</div>

<script>
/* 설정: Apps Script 웹앱 URL. 이 파일에는 개인 정보가 없습니다. */
const API_URL = 'https://script.google.com/macros/s/AKfycbz3kW5zRKLM9AKfDzwt96TM9pU9WYV9QIkleEb0zcWtMrgNrUEBstaIvIQEkszqK4sdDg/exec';

const I18N = {
  ko: { lock_title:'웹명함', lock_desc:'명함과 함께 받은 비밀번호를 입력해 주세요.', lock_remember:'이 기기에서 기억하기', lock_enter:'열기', lock_btn:'잠금', flip_hint:'탭하면 뒷면', name_title:'반갑습니다!', name_desc:'이름(또는 소속)을 알려주시면 이름을 불러 인사드릴게요. 방문 기록은 명함 주인만 봅니다.', name_input_ph:'예: 홍길동 · ○○기업 인사팀', name_enter:'입장', name_skip:'이름 없이 보기', greet:'{n}님, 반갑습니다', hello:'안녕하세요!', hello_n:'{n}님, 안녕하세요!', who_title_n:'{n}님은 어떤 분이신가요? 보는 분에 맞춰 순서와 강조가 바뀝니다.',
        save_contact:'연락처 저장', email:'이메일', who_title:'누구신가요? 보는 분에 맞춰 순서와 강조가 바뀝니다.', loading:'이력을 불러오는 중입니다…',
        empty:'위에서 하나를 고르면, 그 분께 맞춘 순서로 이야기와 이력이 펼쳐집니다.', first_look:'님께 먼저 보여드리는 것', rank:'보기',
        sec:{stories:'이야기 세 개', numbers:'숫자로 보는 나', timeline:'이력', skills:'할 수 있는 것', goals:'진행 중', ask:'나에게 물어보기', contact:'연락'},
        sub:{stories:'이력 나열 대신, 이 셋이 저를 보여줍니다 · 하나씩 열어 보세요', numbers:'형용사 대신 숫자로', timeline:'최근 순 · Google Sheet에서 자동 갱신', skills:'상=가르칠 수 있음 · 중=혼자 할 수 있음 · 하=배우는 중', goals:'1년 뒤의 나', ask:'프로필 범위 안에서만 AI가 답합니다', contact:'메시지를 남겨 주세요'},
        st:{proud:'가장 자랑스러운 경험', hard:'힘들었지만 배운 경험', problem:'풀고 싶은 문제'},
        f:{when:'언제 · 어디', role:'내 역할', result:'결과', learned:'배운 점', problem:'문제', why:'왜', how:'어떻게'},
        lv:{'상':'상','중':'중','하':'하'}, more:'전체 보기', less:'접기', open_story:'눌러서 이야기 열기', close_story:'접기 ↑', ask_ph:'예: 어떤 자격이 있나요?', ask_btn:'질문', now:'진행 중',
        g:{one_year:'1년 안에', before_grad:'졸업 전까지', want_to_try:'더 해보고 싶은 일', career:'진로'},
        name_ph:'이름(선택)', msg_ph:'메시지', send:'보내기', sent:'전송되었습니다. 감사합니다!', send_fail:'전송에 실패했습니다.', gb_title:'방명록', mail_title:'공개 연락처',
        foot:'이 명함은 Google Sheet 한 줄을 고치면 바뀝니다 · 스포츠AI메이커스 과제', vcard_note:'연락처 저장 버튼은 이메일·소속·이 주소를 담은 vCard 파일을 내려받습니다.' },
  en: { lock_title:'Web Card', lock_desc:'Enter the password you received with the card.', lock_remember:'Remember on this device', lock_enter:'Open', lock_btn:'Lock', flip_hint:'Tap to flip', name_title:'Nice to meet you!', name_desc:'Tell me your name (or organization) and I will greet you by name. Only the card owner sees visits.', name_input_ph:'e.g. Jane Doe · HR team', name_enter:'Enter', name_skip:'Continue without a name', greet:'Welcome, {n}', hello:'Hello!', hello_n:'Hi, {n}!', who_title_n:'{n}, who are you? Order and emphasis adapt to the reader.',
        save_contact:'Save contact', email:'Email', who_title:'Who are you? Order and emphasis adapt to the reader.', loading:'Loading profile…',
        empty:'Pick one above and the stories and timeline unfold in the order that fits you.', first_look:': what to see first', rank:'pick',
        sec:{stories:'Three stories', numbers:'In numbers', timeline:'Timeline', skills:'Skills', goals:'In progress', ask:'Ask me', contact:'Contact'},
        sub:{stories:'Not a list of jobs — three stories that show who I am · open one', numbers:'Facts, not adjectives', timeline:'Newest first · synced from Google Sheet', skills:'High = can teach · Mid = can do alone · Low = learning', goals:'One year from now', ask:'AI answers only within my profile', contact:'Leave a message'},
        st:{proud:'Proudest moment', hard:'Hardest lesson', problem:'A problem I want to solve'},
        f:{when:'When · where', role:'My role', result:'Result', learned:'What I learned', problem:'Problem', why:'Why', how:'How'},
        lv:{'상':'High','중':'Mid','하':'Low'}, more:'Show all', less:'Show less', open_story:'Tap to open the story', close_story:'Close ↑', ask_ph:'e.g. What certifications do you have?', ask_btn:'Ask', now:'now',
        g:{one_year:'Within a year', before_grad:'Before graduation', want_to_try:'Want to try', career:'Career'},
        name_ph:'Name (optional)', msg_ph:'Message', send:'Send', sent:'Sent. Thank you!', send_fail:'Failed to send.', gb_title:'Guestbook', mail_title:'Public contact',
        foot:'Edit one row in Google Sheet and this card updates · Sports AI Makers assignment', vcard_note:'“Save contact” downloads a vCard with email, affiliation and this URL.' }
};
const SEC_IDS = { '이야기 3개':'stories', '숫자로 보는 나':'numbers', '이력 타임라인':'timeline', '스킬':'skills', '진행 중(목표)':'goals', '나에게 물어보기':'ask', '연락':'contact' };
const DEFAULT_ORDER = ['stories','numbers','timeline','skills','goals','ask','contact'];
const LEVEL_W = { '상':100, '중':66, '하':33 };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let lang = localStorage.getItem('wc_lang') || 'ko';
let DATA = null, faceIdx = -1, tlExpanded = false;       // 독자 선택은 매번 새로 묻습니다(저장하지 않음)
const $ = (s) => document.querySelector(s);
const t = () => I18N[lang];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pw = () => sessionStorage.getItem('wc_pw') || localStorage.getItem('wc_pw') || '';
const visitor = () => sessionStorage.getItem('wc_visitor') || '';                 // 방문자 이름(이 탭에서만 기억)
const visitId = () => { let v = sessionStorage.getItem('wc_vid'); if (!v) { v = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); sessionStorage.setItem('wc_vid', v); } return v; };
const fmt = (str, n) => String(str).replace('{n}', n);

/* ───── API ───── */
async function apiGet(params) {
  if (API_URL.startsWith('PASTE_')) throw new Error(lang === 'ko' ? '백엔드 주소(API_URL)가 아직 설정되지 않았습니다.' : 'API_URL is not configured yet.');
  const u = new URL(API_URL); Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  return (await fetch(u.toString(), { method: 'GET', redirect: 'follow' })).json();
}
async function apiPost(body) { return (await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(body) })).json(); }

/* ───── 잠금 ───── */
$('#lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('#pw').value.trim(); const msg = $('#lockMsg'); msg.textContent = '…';
  try {
    const res = await apiGet({ action: 'auth', pw: v });
    if (!res.ok) { msg.textContent = res.error || (lang === 'ko' ? '비밀번호가 맞지 않습니다.' : 'Wrong password.'); const b = $('.lock-box'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
    ($('#remember').checked ? localStorage : sessionStorage).setItem('wc_pw', v);
    msg.textContent = ''; showNameStep();                                  // 비밀번호 통과 → 이름 묻기
  } catch (err) { msg.textContent = err.message; }
});
$('#lockBtn').addEventListener('click', () => { localStorage.removeItem('wc_pw'); sessionStorage.removeItem('wc_pw'); sessionStorage.removeItem('wc_entered'); location.reload(); });

/* ───── 방문자 이름 → 인사 + 방문 기록 ───── */
function showNameStep() {
  $('#lock').hidden = false; $('#app').hidden = true; $('#lockForm').hidden = true; $('#nameForm').hidden = false; applyLabels();
  setTimeout(() => $('#visitorName').focus(), 80);
}
function enterAs(name) {
  sessionStorage.setItem('wc_visitor', name); sessionStorage.setItem('wc_entered', '1');
  logVisit({ name });                                                          // 방문 기록(이름·기기·언어) → 시트 "방문기록" + 알림 메일
  openApp();
}
function logVisit(extra) {
  if (API_URL.startsWith('PASTE_')) return;
  apiPost(Object.assign({ type: 'visit', pw: pw(), id: visitId(), device: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'pc', lang }, extra)).catch(() => {});
}
$('#nameForm').addEventListener('submit', (e) => { e.preventDefault(); enterAs($('#visitorName').value.trim().slice(0, 30)); });
$('#skipName').addEventListener('click', () => enterAs(''));

async function openApp() {
  $('#lock').hidden = true; $('#app').hidden = false; applyLabels();
  try {
    const res = await apiGet({ action: 'data', pw: pw() });
    if (!res.ok) { localStorage.removeItem('wc_pw'); sessionStorage.removeItem('wc_pw'); sessionStorage.removeItem('wc_entered'); $('#lock').hidden = false; $('#app').hidden = true; $('#lockForm').hidden = false; $('#nameForm').hidden = true; $('#lockMsg').textContent = res.error || ''; return; }
    DATA = res.data; renderAll();
    setTimeout(playPeek, 900);                                               // 잠금이 풀리면 캐릭터가 명함 위로 살짝 나와 손인사
  } catch (err) { $('#sections').innerHTML = `<p class="loading">${esc(err.message)}</p>`; }
}

/* ───── 렌더 ───── */
function applyLabels() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (t()[k]) el.textContent = t()[k]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { const k = el.dataset.i18nPh; if (t()[k]) el.placeholder = t()[k]; });
  $('#langBtn').textContent = lang === 'ko' ? 'EN' : '한';
  document.documentElement.lang = lang; $('#footText').textContent = t().foot;
}
function currentFace() { return DATA && DATA.faces[faceIdx] ? DATA.faces[faceIdx] : null; }
function orderIds() {
  const f = currentFace(); if (!f) return DEFAULT_ORDER;
  const ids = f.order.map(o => SEC_IDS[o]).filter(Boolean);
  DEFAULT_ORDER.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  return ids;
}
function faceName(x) { return lang === 'ko' ? x.audience : (x.audience_en || x.audience); }

function renderAll() {
  const b = DATA.basic, f = currentFace();
  $('#brand').textContent = lang === 'ko' ? b.name_ko : b.name_en;
  $('#nameKo').textContent = lang === 'ko' ? b.name_ko : b.name_en;
  $('#nameEn').textContent = lang === 'ko' ? b.name_en : b.name_ko;
  $('#backName').textContent = b.name_ko + ' · ' + b.name_en;
  $('#aff').textContent = (lang === 'en' && b.affiliation_en) ? b.affiliation_en : b.affiliation;
  $('#tagline').textContent = f ? (lang === 'ko' ? f.tagline_ko : f.tagline_en) : (b.taglines[0] || '');
  const kws = (lang === 'en' && b.keywords_en.length) ? b.keywords_en : b.keywords;
  $('#chips').innerHTML = kws.map(k => `<span class="chip">${esc(k)}</span>`).join('');
  $('#mailBtn').href = 'mailto:' + b.email;
  $('#imgWhy').textContent = b.image_reason ? (lang === 'ko' ? '이미지를 고른 이유 · ' : 'Why this image · ') + b.image_reason : '';
  $('#profileImg').alt = b.name_ko;
  const vn = visitor();
  $('#greet').textContent = vn ? fmt(t().greet, vn) : '';
  $('.who-title').textContent = vn ? fmt(t().who_title_n, vn) : t().who_title;

  $('#faces').innerHTML = DATA.faces.map((x, i) => `<button type="button" class="face-btn ${i === faceIdx ? 'on' : ''}" data-i="${i}">${esc(faceName(x))}</button>`).join('');
  $('#faces').querySelectorAll('.face-btn').forEach(btn => btn.addEventListener('click', () => {
    faceIdx = Number(btn.dataset.i); renderAll();
    logVisit({ reader: DATA.faces[faceIdx].audience });                      // 어떤 독자로 봤는지 같은 방문 줄에 기록
    if (!REDUCED) $('#flip').classList.add('flipped');                       // 독자를 고르면 명함이 뒷면(그 독자용 한 줄 소개)으로 돌아섭니다
    setTimeout(() => $('#hl').scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
  }));

  const hl = $('#hl');
  if (!f) {                                                                  // 아직 고르지 않음: 아래는 비워 둡니다
    hl.hidden = true; $('#menu').innerHTML = '';
    $('#sections').innerHTML = `<div class="empty">${t().empty}</div>`;
    return;
  }
  hl.hidden = false;
  hl.innerHTML = `<b>${esc(faceName(f))}${t().first_look}</b><ol>${f.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ol>`;
  const ids = orderIds();
  $('#menu').innerHTML = ids.map(id => `<a href="#${id}">${t().sec[id]}</a>`).join('');
  const R = { stories: renderStories, numbers: renderNumbers, timeline: renderTimeline, skills: renderSkills, goals: renderGoals, ask: renderAsk, contact: renderContact };
  $('#sections').innerHTML = ids.map((id, i) => R[id](i)).filter(Boolean).join('');
  bindDynamic(); observe();
}
const block = (id, inner, i) => {
  if (!inner) return '';
  const f = currentFace();
  const rank = (f && i < 3) ? `<span class="rank">${esc(faceName(f))} ${t().rank} ${i + 1}</span>` : '';
  return `<section class="block" id="${id}" style="animation-delay:${i * 90}ms"><div class="h"><h2>${t().sec[id]}</h2><span>${t().sub[id]}</span>${rank}</div>${inner}</section>`;
};

function renderStories(i) {
  const S = DATA.stories; if (!S.length) return '';
  const F = t().f, keyLabel = { story_proud: t().st.proud, story_hard: t().st.hard, story_problem: t().st.problem };
  const card = (s, j) => {
    const title = (lang === 'en' && s.title_en) ? s.title_en : s.title;
    const rows = s.key === 'story_problem' ? [[F.problem, s.problem], [F.why, s.why], [F.how, s.how]] : [[F.when, s.when_where], [F.role, s.role], [F.result, s.result], [F.learned, s.learned]];
    return `<article class="story in sealed" data-story="${j}" style="transition-delay:${j * 120}ms" tabindex="0" role="button" aria-expanded="false">
      <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 8 9 6 9-6"/></svg></div>
      <div class="k">${esc(keyLabel[s.key] || '')}</div>
      <div class="open-hint">${t().open_story}</div>
      <div class="body"><h3>${esc(title)}</h3><dl>${rows.filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl><button type="button" class="close">${t().close_story}</button></div>
    </article>`;
  };
  return block('stories', `<div class="stories">${S.map(card).join('')}</div>`, i);
}
function renderNumbers(i) {
  const N = DATA.numbers; if (!N.length) return '';
  // 숫자 부분만 <b data-n>으로 감싸 카운트업 대상으로 만듭니다
  const wrapNums = (v) => esc(v).replace(/\d+(?:\.\d+)?/g, m => `<b data-n="${m}">0</b>`);
  return block('numbers', `<div class="nums">${N.map((n, j) => `<div class="num in" style="transition-delay:${j * 80}ms"><div class="v">${wrapNums(n.value)}</div><div class="w">${esc(n.what)}</div><div class="b">${esc(n.basis)}</div></div>`).join('')}</div>`, i);
}
function renderTimeline(i) {
  const T = DATA.timeline; if (!T.length) return '';
  const limit = 8, shown = tlExpanded ? T : T.slice(0, limit);
  const li = (x, j) => `<li class="in ${/자격/.test(x.type) ? 'cert' : ''} ${/현재|now/i.test(x.end) ? 'live' : ''}" style="transition-delay:${Math.min(j, 8) * 70}ms"><div class="d">${esc(x.start || '—')}${x.end ? ' ~ ' + esc(x.end) : ''}</div><div class="n">${esc(x.name)}<span class="badge">${esc(x.type)}</span></div>${x.role ? `<div class="r">${esc(x.role)}</div>` : ''}</li>`;
  const more = T.length > limit ? `<button class="btn more" type="button" id="tlMore">${tlExpanded ? t().less : t().more + ` (${T.length})`}</button>` : '';
  return block('timeline', `<ul class="tl">${shown.map(li).join('')}</ul>${more}`, i);
}
function renderSkills(i) {
  const S = DATA.skills; if (!S.length) return '';
  const groups = {}; S.forEach(s => { (groups[s.area] = groups[s.area] || []).push(s); });
  const g = (area, items) => `<div class="sk in"><h4>${esc(area)}</h4>${items.map(s => `<div class="row"><span>${esc(s.item)}</span>${s.level ? `<div class="bar"><i data-w="${LEVEL_W[s.level] || 0}"></i></div><span class="lv">${esc(t().lv[s.level] || s.level)}</span>` : '<span></span><span></span>'}</div>`).join('')}</div>`;
  return block('skills', `<div class="skills">${Object.entries(groups).map(([a, it]) => g(a, it)).join('')}</div>`, i);
}
function renderGoals(i) {
  const G = DATA.goals; const keys = ['one_year', 'before_grad', 'want_to_try', 'career'].filter(k => G[k]); if (!keys.length) return '';
  return block('goals', `<div class="goals">${keys.map((k, j) => `<div class="goal in" style="transition-delay:${j * 80}ms"><b>${t().g[k]}</b>${esc(G[k])}</div>`).join('')}</div>`, i);
}
function renderAsk(i) {
  const faq = DATA.faq.map((f, j) => `<button type="button" data-q="${j}">${esc(f.q)}</button>`).join('');
  return block('ask', `<div class="ask-box in"><div class="faq">${faq}</div><form class="inline" id="askForm"><input id="askInput" placeholder="${esc(t().ask_ph)}" maxlength="300" required><button class="btn primary" type="submit">${t().ask_btn}</button></form><div class="answer" id="answer" hidden></div></div>`, i);
}
function renderContact(i) {
  return block('contact', `<div class="contact-grid">
    <div class="contact-box in"><h4 style="margin:0 0 10px">${t().mail_title}</h4><div class="mailrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><a href="mailto:${esc(DATA.basic.email)}">${esc(DATA.basic.email)}</a></div><p class="note">${t().vcard_note}</p></div>
    <div class="contact-box in" style="transition-delay:100ms"><h4 style="margin:0 0 10px">${t().gb_title}</h4><form class="stack" id="gbForm"><input id="gbName" placeholder="${esc(t().name_ph)}" maxlength="40" value="${esc(visitor())}"><textarea id="gbMsg" rows="3" placeholder="${esc(t().msg_ph)}" maxlength="500" required></textarea><button class="btn primary" type="submit" style="align-self:flex-end">${t().send}</button><div class="note" id="gbMsgOut"></div></form></div>
  </div>`, i);
}

/* ───── 스크롤에 따라 나타나기 · 카운트업 · 스킬 바 ───── */
function observe() {
  const els = document.querySelectorAll('.in');
  if (REDUCED || !('IntersectionObserver' in window)) { els.forEach(show); return; }
  const io = new IntersectionObserver((entries) => entries.forEach(en => { if (en.isIntersecting) { show(en.target); io.unobserve(en.target); } }), { threshold: 0.15 });
  els.forEach(el => io.observe(el));
}
function show(el) {
  el.classList.add('show');
  el.querySelectorAll('[data-w]').forEach(b => { b.style.width = b.dataset.w + '%'; });
  el.querySelectorAll('[data-n]').forEach(countUp);
}
function countUp(b) {
  const target = parseFloat(b.dataset.n), dec = (b.dataset.n.split('.')[1] || '').length;
  if (REDUCED) { b.textContent = b.dataset.n; return; }
  const dur = 900, t0 = performance.now();
  const step = (now) => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); b.textContent = (target * e).toFixed(dec); if (p < 1) requestAnimationFrame(step); else b.textContent = b.dataset.n; };
  requestAnimationFrame(step);
}

function bindDynamic() {
  document.querySelectorAll('.story[data-story]').forEach(card => {
    const toggle = () => {                                                     // 한 번 누르면 열리고, 다시 누르면 닫힙니다
      const opening = card.classList.contains('sealed');
      card.classList.toggle('sealed', !opening); card.classList.toggle('opened', opening); card.setAttribute('aria-expanded', String(opening));
      if (!opening) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    card.addEventListener('click', (e) => { if (e.target.closest('a') || getSelection().toString()) return; toggle(); });
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
  const tlMore = $('#tlMore'); if (tlMore) tlMore.addEventListener('click', () => { tlExpanded = !tlExpanded; renderAll(); document.getElementById('timeline').scrollIntoView({ block: 'start' }); });
  const askForm = $('#askForm');
  if (askForm) {
    document.querySelectorAll('.faq button').forEach(b => b.addEventListener('click', () => { const f = DATA.faq[Number(b.dataset.q)]; $('#askInput').value = f.q; typeAnswer(f.a); }));
    askForm.addEventListener('submit', async (e) => {
      e.preventDefault(); const q = $('#askInput').value.trim(); if (!q) return;
      const hit = DATA.faq.find(f => f.q === q); if (hit) { typeAnswer(hit.a); return; }
      const a = $('#answer'); a.hidden = false; a.classList.remove('err'); a.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      try { const r = await apiPost({ type: 'ask', pw: pw(), question: q }); typeAnswer(r.ok ? r.answer : (r.error || 'error'), !r.ok); }
      catch (err) { typeAnswer(err.message, true); }
    });
  }
  const gb = $('#gbForm');
  if (gb) gb.addEventListener('submit', async (e) => {
    e.preventDefault(); const out = $('#gbMsgOut'); out.textContent = '…';
    try { const r = await apiPost({ type: 'guestbook', pw: pw(), name: $('#gbName').value.trim(), message: $('#gbMsg').value.trim() });
      out.textContent = r.ok ? t().sent : (r.error || t().send_fail); if (r.ok) { $('#gbMsg').value = ''; $('#gbName').value = ''; } }
    catch (err) { out.textContent = t().send_fail; }
  });
}
let typer = 0;
function typeAnswer(text, isErr) {
  const a = $('#answer'); a.hidden = false; a.classList.toggle('err', !!isErr); clearInterval(typer);
  if (REDUCED || isErr) { a.textContent = text; return; }
  let i = 0; a.textContent = '';
  typer = setInterval(() => { i += 2; a.textContent = text.slice(0, i); if (i >= text.length) clearInterval(typer); }, 18);
}

/* ───── 캐릭터 고개 내밀기 + 손인사 ───── */
const POP = { cols: 8, rows: 8, n: 62, fps: 12 };                          // 영상(엠버 손인사.mp4) 62프레임 → 스프라이트 시트
let popping = false, popRaf = 0;
function playPeek() {
  if (REDUCED || popping) return;
  popping = true;
  const av = $('#avatar'), sp = $('#popSprite');
  const frame = (k) => { sp.style.backgroundPosition = `${(k % POP.cols) / (POP.cols - 1) * 100}% ${Math.floor(k / POP.cols) / (POP.rows - 1) * 100}%`; };
  frame(0); av.classList.remove('sinking'); av.classList.add('popping');
  const t0 = performance.now() + 350;                                         // 올라오는 동안은 팔 내린 첫 프레임
  const tick = (now) => {
    const k = Math.floor((now - t0) / 1000 * POP.fps);
    if (k >= POP.n) {                                                         // 다 흔들었으면 다시 동그라미 안으로
      av.classList.remove('popping'); av.classList.add('sinking');
      setTimeout(() => { av.classList.remove('sinking'); popping = false; }, 600); return;
    }
    if (k >= 0) frame(k);
    popRaf = requestAnimationFrame(tick);
  };
  popRaf = requestAnimationFrame(tick);
}
setInterval(() => {                                                            // 명함 앞면이 화면에 보이는 동안 15초마다 다시 인사
  if (document.hidden || $('#app').hidden || !DATA || $('#flip').classList.contains('flipped')) return;
  const r = $('#avatar').getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight) return;
  playPeek();
}, 15000);

/* ───── 명함 뒤집기 ───── */
const flip = $('#flip');
flip.addEventListener('click', (e) => { if (e.target.closest('button, a')) return; if (e.target.id === 'profileImg') { playPeek(); return; } flip.classList.toggle('flipped'); });
flip.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip.classList.toggle('flipped'); } });
flip.tabIndex = 0;

/* ───── vCard ───── */
$('#vcardBtn').addEventListener('click', () => {
  const b = DATA.basic; if (!b) return;
  const v = ['BEGIN:VCARD', 'VERSION:3.0', `N:${b.name_ko};;;;`, `FN:${b.name_ko} (${b.name_en})`, `ORG:${b.affiliation}`, `EMAIL;TYPE=INTERNET:${b.email}`, `URL:${location.origin}${location.pathname}`, `NOTE:${(b.taglines[0] || '')}`, 'END:VCARD'].join('\r\n');
  const blob = new Blob([v], { type: 'text/vcard;charset=utf-8' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${b.name_en.replace(/\s+/g, '_')}.vcf`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

$('#langBtn').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; localStorage.setItem('wc_lang', lang); applyLabels(); if (DATA) renderAll(); });

applyLabels();
if (pw()) { sessionStorage.getItem('wc_entered') ? openApp() : showNameStep(); }   // 비밀번호를 기억해도 이름은 탭마다 한 번 묻습니다
</script>
